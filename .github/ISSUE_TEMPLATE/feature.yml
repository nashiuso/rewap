name: Feature request
description: Propose something the library doesn't do yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [docs/content/known-limitations.md](../../docs/content/known-limitations.md)
        first — some gaps (cross-layout dragging, free-form positioning) are
        known and already explained there.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the API you imagine. "I need X because Y" is more useful than "add a `foo` prop."
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How are you working around it today, if at all?

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API (optional)
      description: A sketch is fine. This is a starting point for discussion, not a commitment to ship it as written.
