# Publishes to npm when a `v*` tag is pushed. This workflow has never run —
# no tag exists in this repository yet, and nothing in this codebase creates
# one automatically (see MAINTAINERS.md's release checklist, which is a
# manual, human-run set of steps on purpose).
#
# Requires an `NPM_TOKEN` repository secret (an npm "Automation" token scoped
# to this package) to be added by a maintainer with publish rights before the
# first tag is pushed. Until that secret exists, a tag push will make this
# workflow fail at the `npm publish` step rather than silently do nothing —
# that's intentional, so a missing token is loud instead of quiet.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Full verification (same checks as CI, run again on the tag)
        run: |
          npm run format:check
          npm run typecheck
          npm run typecheck:examples
          npm run lint
          npm test
          npm run test:types
          npm run build
          npm run lint:package
          npm run verify:package

      - name: Confirm tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
