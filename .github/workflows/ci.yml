# npm is the only package manager used here, and ' npm ci ' installs from the
# committed ' package-lock.json ', so a green run means the locked tree is green.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Types (examples app)
        run: npm run typecheck:examples

      - name: Types (public API)
        run: npm run test:types

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package (publint, exports, dist, stylesheets)
        run: |
          npm run lint:package
          npm run verify:package

      - name: Documentation site
        run: npm run docs:build

      - name: Examples app
        run: npm run examples:build

      - name: Install Chromium
        if: matrix.node == 20
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        if: matrix.node == 20
        run: npm run test:e2e

      - name: Upload traces
        if: failure() && matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  astro-example:
    name: astro example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install the example
        working-directory: examples/astro
        run: npm install --no-audit --no-fund

      - name: Build the example
        working-directory: examples/astro
        run: npm run build
