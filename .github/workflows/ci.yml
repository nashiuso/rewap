name: CI

on:
  push:
    branches: [main, "work/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  library:
    name: library (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
        env:
          npm_config_yes: true
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:types
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run lint:package
      - run: npm run verify:package
      - run: npm run verify:github-install

  site:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          npm_config_yes: true
      - run: test -f dist/index.js && test -f dist/types/index.d.ts
      - run: npm run site:build
